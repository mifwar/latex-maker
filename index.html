<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyMCE with MathJax (Bidirectional)</title>
    
    <!-- TinyMCE CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.7.0/tinymce.min.js"></script>
    
    <!-- MathJax CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-AMS_HTML"></script>

    <style>
        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }
        .preview {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .math {
            background-color: #f0f0f0;
            padding: 2px 4px;
            border-radius: 3px;
            cursor: pointer;
        }
        .mce-content-body .math::before {
            content: attr(data-latex);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .modal-content {
            position: relative;
            background-color: #fff;
            margin: 5% auto;
            padding: 20px;
            width: 80%;
            max-width: 800px;
            border-radius: 5px;
        }
        .close {
            position: absolute;
            right: 10px;
            top: 5px;
            font-size: 24px;
            cursor: pointer;
        }
        .html-input {
            width: 100%;
            height: 200px;
            margin: 10px 0;
            font-family: monospace;
            padding: 10px;
        }
        .button-container {
            margin-top: 10px;
            text-align: right;
        }
        .custom-button {
            background-color: #4CAF50;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
        }
        .custom-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <textarea id="editor"></textarea>
        <div class="preview" id="preview"></div>
    </div>

    <!-- Modal for HTML input -->
    <div id="htmlModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Parse HTML with Math Elements</h2>
            <p>Paste your HTML content below:</p>
            <textarea id="htmlInput" class="html-input"></textarea>
            <div class="button-container">
                <button class="custom-button" onclick="closeModal()">Cancel</button>
                <button class="custom-button" onclick="parseAndInsertHTML()">Insert</button>
            </div>
        </div>
    </div>

    <script>
        // Configure MathJax
        MathJax.Hub.Config({
            tex2jax: {
                inlineMath: [['$','$'], ['\\(','\\)']],
                processClass: 'math',
                ignoreClass: 'no-math',
                processElements: 'samp'
            },
            messageStyle: 'none',
            skipStartupTypeset: true
        });

        function refreshMathJax() {
            if (typeof MathJax !== 'undefined') {
                MathJax.Hub.Queue(['Typeset', MathJax.Hub]);
            }
        }

        function formatLatex(latex) {
            return latex.replace(/\\/g, '\\\\');
        }

        // Modal functions
        function showModal() {
            document.getElementById('htmlModal').style.display = 'block';
            document.getElementById('htmlInput').value = '';
        }

        function closeModal() {
            document.getElementById('htmlModal').style.display = 'none';
        }

        function parseAndInsertHTML() {
            const htmlContent = document.getElementById('htmlInput').value;
            if (htmlContent.trim()) {
                tinymce.activeEditor.setContent(htmlContent);
                setTimeout(() => {
                    refreshMathJax();
                    updatePreview(tinymce.activeEditor);
                }, 100);
            }
            closeModal();
        }

        tinymce.init({
            selector: '#editor',
            plugins: 'code preview',
            toolbar: 'undo redo | formatselect | bold italic | alignleft aligncenter alignright | code preview | insertmath parsehtml',
            height: 400,
            setup: function(editor) {
                // Add Insert Math button
                editor.ui.registry.addButton('insertmath', {
                    text: 'Insert Math',
                    onAction: function() {
                        const latex = prompt('Enter LaTeX formula:', '');
                        if (latex) {
                            const formattedLatex = formatLatex(latex);
                            const mathElement = `<samp class="math mceNonEditable" data-latex="${formattedLatex}">$${latex}$</samp>`;
                            editor.insertContent(mathElement);
                            
                            setTimeout(() => {
                                refreshMathJax();
                                updatePreview(editor);
                            }, 100);
                        }
                    }
                });

                // Add Parse HTML button
                editor.ui.registry.addButton('parsehtml', {
                    text: 'Parse HTML',
                    onAction: function() {
                        showModal();
                    }
                });

                editor.on('Change', function() {
                    updatePreview(editor);
                });

                editor.on('init', function() {
                    const editorHead = editor.getDoc().getElementsByTagName('head')[0];
                    const mathjaxScript = editor.getDoc().createElement('script');
                    mathjaxScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-AMS_HTML';
                    editorHead.appendChild(mathjaxScript);

                    mathjaxScript.onload = function() {
                        editor.getWin().MathJax.Hub.Config({
                            tex2jax: {
                                inlineMath: [['$','$'], ['\\(','\\)']],
                                processClass: 'math',
                                ignoreClass: 'no-math',
                                processElements: 'samp'
                            },
                            messageStyle: 'none'
                        });
                        
                        setInitialContent(editor);
                    };
                });
            },
            content_style: `
                .math { 
                    background-color: #f0f0f0;
                    padding: 2px 4px;
                    border-radius: 3px;
                    cursor: pointer;
                }
            `,
            invalid_elements: '',
            extended_valid_elements: 'samp[class|data-latex]'
        });

        function updatePreview(editor) {
            const content = editor.getContent();
            document.getElementById('preview').innerHTML = content;
            refreshMathJax();
        }

        function setInitialContent(editor) {
            const initialContent = `<p>Jika grafik <samp class="math mceNonEditable" data-latex="y=x^{2}-\\left(2^{p-3}+2^{3-p}\\right) x+1">$y=x^{2}-\\left(2^{p-3}+2^{3-p}\\right) x+1$</samp> menyinggung sumbu <samp class="math mceNonEditable" data-latex="x">$x$</samp>, maka nilai <samp class="math mceNonEditable" data-latex="p">$p$</samp> yang memenuhi adalah ....</p>`;
            
            editor.setContent(initialContent);
            updatePreview(editor);
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('htmlModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // Initial setup
        window.addEventListener('load', function() {
            if (tinymce.activeEditor) {
                setInitialContent(tinymce.activeEditor);
            }
        });
    </script>
</body>
</html>
